<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Combo Launcher</title>

  <style>
    :root {
      --bg1: #0b0218;
      --bg2: #1a0633;
      --accent: #a855f7;
      --accent2: #6d28d9;
      --text: #fff;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1) 70%);
      color: var(--text);
    }

    .app {
      width: min(620px, 92%);
      padding: 28px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    .title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 20px;
    }

    /* FOLDERS */
    .folder {
      margin-bottom: 12px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
    }

    .folder-header {
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .folder-header:hover {
      background: rgba(255,255,255,0.06);
    }

    .chevron {
      transition: transform 0.25s ease;
    }

    .folder.open .chevron {
      transform: rotate(90deg);
    }

    .folder-content {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;

      max-height: 0;
      overflow: hidden;
      opacity: 0;
      padding: 0 16px;

      transition: all 0.35s ease;
    }

    .folder.open .folder-content {
      max-height: 500px;
      opacity: 1;
      padding: 16px;
    }

    /* TILE */
    .tile {
      position: relative;
      padding: 16px 12px;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      overflow: hidden;
      display: block;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .tile:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(168,85,247,0.25);
      border-color: rgba(168,85,247,0.6);
    }

    .tile:active {
      transform: scale(0.95);
    }

    .icon {
      width: 34px;
      height: 34px;
      margin: 0 auto 8px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .name {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }

    .desc {
      text-align: center;
      font-size: 11px;
      opacity: 0.7;
      margin-top: 3px;
    }

    /* RIPPLE */
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 600ms linear;
      background: rgba(255,255,255,0.35);
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="title">Combo Launcher</div>
    <div class="subtitle">Grouped versions</div>

    <!-- V1 -->
    <div class="folder open">
      <div class="folder-header">
        <div>Version 1</div>
        <div class="chevron">▶</div>
      </div>
      <div class="folder-content">
        <a class="tile" href="combo.html">
          <div class="icon">1</div>
          <div class="name">v1</div>
          <div class="desc">Base version</div>
        </a>
      </div>
    </div>

    <!-- V2 -->
    <div class="folder">
      <div class="folder-header">
        <div>Version 2</div>
        <div class="chevron">▶</div>
      </div>
      <div class="folder-content">
        <a class="tile" href="combov2point1.html">
          <div class="icon">2.1</div>
          <div class="name">v2.1</div>
          <div class="desc">Update</div>
        </a>

        <a class="tile" href="combov2point2.html">
          <div class="icon">2.2</div>
          <div class="name">v2.2</div>
          <div class="desc">Bug fixes</div>
        </a>
      </div>
    </div>

    <!-- V3 -->
    <div class="folder">
      <div class="folder-header">
        <div>Version 3</div>
        <div class="chevron">▶</div>
      </div>
      <div class="folder-content">
        <a class="tile" href="combov3.html">
          <div class="icon">3</div>
          <div class="name">v3</div>
          <div class="desc">Latest</div>
        </a>
      </div>
    </div>
  </div>

  <script>
    // folder toggle (FIXED)
    document.querySelectorAll(".folder-header").forEach(header => {
      header.addEventListener("click", () => {
        header.parentElement.classList.toggle("open");
      });
    });

    // ripple (FIXED + works reliably)
    document.querySelectorAll(".tile").forEach(tile => {
      tile.addEventListener("click", function (e) {
        const ripple = document.createElement("span");
        ripple.classList.add("ripple");

        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);

        ripple.style.width = ripple.style.height = size + "px";
        ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
        ripple.style.top = (e.clientY - rect.top - size / 2) + "px";

        this.appendChild(ripple);

        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>
</body>
</html>
