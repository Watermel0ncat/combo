<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Feature Hub</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #007bff; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        nav { background: #000; width: 100%; display: flex; justify-content: center; padding: 15px 0; position: sticky; top: 0; z-index: 1000; }
        nav button { background: #333; color: white; border: none; padding: 12px 20px; margin: 0 10px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        nav button.active { background: var(--primary); }

        .section { display: none; width: 90%; max-width: 800px; margin-top: 30px; background: var(--card); padding: 30px; border-radius: 15px; text-align: center; }
        .section.active { display: block; }

        /* Web Previewer Styles */
        #preview-container { width: 100%; background: white; border-radius: 8px; overflow: hidden; margin-top: 15px; }
        #preview-frame { width: 100%; height: 500px; border: none; }
        .url-bar { display: flex; gap: 10px; margin-bottom: 10px; }
        .url-bar input { flex-grow: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; }
        button { padding: 10px 15px; border-radius: 5px; border: none; cursor: pointer; background: var(--primary); color: white; font-weight: bold; }
        .btn-alt { background: #444; }

        /* Other Game Styles */
        .bj-display { font-size: 1.2rem; margin: 20px 0; padding: 15px; background: #252525; border-radius: 10px; }
        .hand { color: #ffcc00; font-weight: bold; }
        .wheel-container { position: relative; width: 200px; height: 200px; margin: 20px auto; border: 10px solid #444; border-radius: 50%; background: conic-gradient(red 0% 50%, black 50% 100%); }
        #rat { font-size: 50px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: transform 3s cubic-bezier(0.1, 0, 0.1, 1); }
        .dice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 10px; margin-top: 20px; }
        #dice-res { font-size: 3rem; margin: 20px 0; color: #ffcc00; }
    </style>
</head>
<body>

<nav>
    <button onclick="switchTab('tab-preview', this)" class="active">Web Preview</button>
    <button onclick="switchTab('tab-blackjack', this)">Blackjack</button>
    <button onclick="switchTab('tab-rat', this)">Rat Roulette</button>
    <button onclick="switchTab('tab-dice', this)">DnD Dice</button>
</nav>

<!-- Webpage Previewer -->
<div id="tab-preview" class="section active">
    <h2>Webpage Previewer</h2>
    <div class="url-bar">
        <input type="text" id="url-input" placeholder="https://wikipedia.org">
        <button onclick="loadURL()">Load</button>
        <button class="btn-alt" onclick="toggleFullscreen()">Full Screen</button>
    </div>
    <div id="preview-container">
        <iframe id="preview-frame" src="about:blank" allowfullscreen></iframe>
    </div>
</div>

<!-- Blackjack -->
<div id="tab-blackjack" class="section">
    <h2>Blackjack</h2>
    <div id="bj-msg">Click "Deal" to start!</div>
    <div class="bj-display">
        <div>Dealer: <span id="dealer-hand" class="hand">-</span></div>
        <div>Player: <span id="player-hand" class="hand">-</span></div>
    </div>
    <button onclick="bjStart()">Deal</button>
    <button id="hit-btn" onclick="bjHit()" disabled>Hit</button>
    <button id="stay-btn" onclick="bjStay()" disabled>Stay</button>
</div>

<!-- Rat Roulette -->
<div id="tab-rat" class="section">
    <h2>Rat Roulette</h2>
    <div class="wheel-container"><div id="rat">🐀</div></div>
    <div id="rat-res" style="margin: 10px 0;">Spin the rat!</div>
    <button onclick="spinRat()">Spin!</button>
</div>

<!-- DnD Dice -->
<div id="tab-dice" class="section">
    <h2>DnD Dice</h2>
    <div id="dice-res">0</div>
    <div class="dice-grid">
        <button onclick="roll(4)">d4</button><button onclick="roll(6)">d6</button>
        <button onclick="roll(8)">d8</button><button onclick="roll(10)">d10</button>
        <button onclick="roll(12)">d12</button><button onclick="roll(20)">d20</button>
    </div>
</div>

<script>
    function switchTab(tabId, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // 1. Previewer with Fullscreen
    function loadURL() {
        let url = document.getElementById('url-input').value;
        if (!url.startsWith('http')) url = 'https://' + url;
        document.getElementById('preview-frame').src = url;
    }

    function toggleFullscreen() {
        const elem = document.getElementById('preview-container');
        const frame = document.getElementById('preview-frame');
        
        if (!document.fullscreenElement) {
            elem.requestFullscreen().then(() => {
                frame.style.height = "100vh"; // Expand height in fullscreen
            }).catch(err => {
                alert(`Error: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    // Adjust height back when exiting fullscreen
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            document.getElementById('preview-frame').style.height = "500px";
        }
    });

    // 2. Blackjack
    let pHand, dHand, bjOver;
    const bjDraw = () => Math.min(10, Math.floor(Math.random() * 11) + 1);
    const bjSum = (h) => h.reduce((a, b) => a + b, 0);
    function bjStart() {
        pHand = [bjDraw(), bjDraw()]; dHand = [bjDraw(), bjDraw()];
        bjOver = false; document.getElementById('hit-btn').disabled = false;
        document.getElementById('stay-btn').disabled = false;
        bjUpdate("Playing...");
    }
    function bjUpdate(msg) {
        document.getElementById('bj-msg').innerText = msg;
        document.getElementById('player-hand').innerText = `${pHand.join('+')} (${bjSum(pHand)})`;
        document.getElementById('dealer-hand').innerText = bjOver ? `${dHand.join('+')} (${bjSum(dHand)})` : `${dHand[0]} + ?`;
    }
    function bjHit() { 
        pHand.push(bjDraw()); 
        if (bjSum(pHand) > 21) bjEnd("Bust! You Lose."); 
        else bjUpdate("Hit or Stay?"); 
    }
    function bjStay() {
        while (bjSum(dHand) < 17) dHand.push(bjDraw());
        const p = bjSum(pHand), d = bjSum(dHand);
        bjEnd(d > 21 || p > d ? "You Win!" : (p < d ? "Dealer Wins." : "Tie!"));
    }
    function bjEnd(msg) { 
        bjOver = true; bjUpdate(msg);
        document.getElementById('hit-btn').disabled = true; document.getElementById('stay-btn').disabled = true;
    }

    // 3. Rat
    function spinRat() {
        const deg = Math.floor(Math.random() * 2000) + 1000;
        document.getElementById('rat').style.transform = `translate(-50%, -50%) rotate(${deg}deg)`;
        setTimeout(() => { document.getElementById('rat-res').innerText = (deg % 360 > 180) ? "Landed on Red!" : "Landed on Black!"; }, 3000);
    }

    // 4. Dice
    function roll(s) { document.getElementById('dice-res').innerText = Math.floor(Math.random() * s) + 1; }
</script>
</body>
</html>
